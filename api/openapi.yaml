openapi: 3.1.0
info:
  license:
    name: Proprietary
    url: https://opayments.io
  title: OPayments API
  version: 1.0.0
servers:
- url: https://api.opayments.io/api/v1
security:
- ProjectIdentity: []
  RequestSignature: []
tags:
- description: Создание оплаты.
  name: Payment
  x-displayName: Платёж
- description: Платежи проекта.
  name: Payments
  x-displayName: Платежи
- description: Возвраты.
  name: Refunds
  x-displayName: Возвраты
- description: Баланс.
  name: Balance
  x-displayName: Баланс
paths:
  /payments/sbp:
    post:
      operationId: createSbpPayment
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSbpPaymentRequest"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/SbpPaymentExisting"
        "201":
          $ref: "#/components/responses/SbpPaymentCreated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/BadGatewayError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        "504":
          $ref: "#/components/responses/GatewayTimeoutError"
      summary: Создать платёж по СБП
      tags:
      - Payment
  /payments/tpay:
    post:
      operationId: createTpayPayment
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTpayPaymentRequest"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/TpayPaymentExisting"
        "201":
          $ref: "#/components/responses/TpayPaymentCreated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/BadGatewayError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        "504":
          $ref: "#/components/responses/GatewayTimeoutError"
      summary: Создать платёж через T-Pay
      tags:
      - Payment
  /payments:
    get:
      description: Возвращает список платежей проекта.
      operationId: listPayments
      parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/PaymentStatuses"
      - $ref: "#/components/parameters/PaymentMethod"
      - $ref: "#/components/parameters/AmountFrom"
      - $ref: "#/components/parameters/AmountTo"
      - $ref: "#/components/parameters/CreatedFrom"
      - $ref: "#/components/parameters/CreatedTo"
      - $ref: "#/components/parameters/CompletedFrom"
      - $ref: "#/components/parameters/CompletedTo"
      - $ref: "#/components/parameters/FailureCode"
      - $ref: "#/components/parameters/Search"
      - $ref: "#/components/parameters/Sort"
      - $ref: "#/components/parameters/SortDirection"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/PaymentList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Найти платежи
      tags:
      - Payments
  /payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
      - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          $ref: "#/components/responses/PaymentDetails"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Получить платёж
      tags:
      - Payments
  /payments/{paymentId}/refunds:
    get:
      operationId: listPaymentRefunds
      parameters:
      - $ref: "#/components/parameters/PaymentId"
      - $ref: "#/components/parameters/RefundState"
      - $ref: "#/components/parameters/RefundReasonCode"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/RefundPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Найти возвраты платежа
      tags:
      - Refunds
    post:
      operationId: createPaymentRefund
      parameters:
      - $ref: "#/components/parameters/PaymentId"
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/RefundExisting"
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingRefund"
          description: Возврат принят в обработку.
          headers:
            Location:
              explode: false
              schema:
                format: uri-reference
                type: string
              style: simple
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/RefundConflictError"
        "422":
          $ref: "#/components/responses/StateError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGatewayError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        "504":
          $ref: "#/components/responses/GatewayTimeoutError"
      summary: Создать возврат
      tags:
      - Refunds
  /refunds/{refundId}:
    get:
      operationId: getRefund
      parameters:
      - $ref: "#/components/parameters/RefundId"
      responses:
        "200":
          $ref: "#/components/responses/Refund"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/RefundNotFoundError"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Получить возврат
      tags:
      - Refunds
  /refunds:
    get:
      description: "Возвращает возвраты по всем платежам текущего проекта. Сортиро\
        вка всегда `createdAt DESC, refundId DESC`; курсор нельзя использовать с д\
        ругими фильтрами."
      operationId: listRefunds
      parameters:
      - $ref: "#/components/parameters/RefundState"
      - $ref: "#/components/parameters/PaymentMethod"
      - $ref: "#/components/parameters/RefundPaymentId"
      - $ref: "#/components/parameters/RefundReasonCode"
      - $ref: "#/components/parameters/CreatedFrom"
      - $ref: "#/components/parameters/CreatedTo"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/RefundPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Найти возвраты проекта
      tags:
      - Refunds
  /balance:
    get:
      description: Возвращает текущий баланс проекта.
      operationId: getBalance
      responses:
        "200":
          content:
            application/json:
              example:
                projectId: a1b2c3d4-e5f6-4a7b-8c9d-0123456789ab
                balance: 150000
                currency: RUB
              schema:
                $ref: "#/components/schemas/Balance"
          description: Баланс проекта.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
      summary: Получить баланс
      tags:
      - Balance
components:
  headers:
    RequestId:
      description: Идентификатор запроса для корреляции.
      explode: false
      schema:
        type: string
      style: simple
    RetryAfter:
      description: Число секунд до следующей попытки.
      explode: false
      schema:
        minimum: 1
        type: integer
      style: simple
  parameters:
    IdempotencyKey:
      explode: false
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 64
        minLength: 4
        type: string
      style: simple
    PaymentId:
      explode: false
      in: path
      name: paymentId
      required: true
      schema:
        example: c9ee7c85-4cc0-494f-a0de-0af7257a66a6
        format: uuid
        type: string
      style: simple
    RefundId:
      explode: false
      in: path
      name: refundId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    OrderId:
      description: Идентификатор заказа в системе мерчанта.
      explode: true
      in: query
      name: orderId
      required: false
      schema:
        maxLength: 128
        type: string
      style: form
    PaymentStatuses:
      explode: true
      in: query
      name: status
      required: false
      schema:
        items:
          enum:
          - pending
          - succeeded
          - cancelled
          - chargebacked
          - refunded
          type: string
        type: array
        default: null
      style: form
    RefundState:
      explode: true
      in: query
      name: status
      required: false
      schema:
        enum:
        - pending
        - accepted
        - declined
        type: string
      style: form
    PaymentMethod:
      explode: true
      in: query
      name: paymentMethod
      required: false
      schema:
        enum:
        - sbp
        - tpay
        type: string
      style: form
    AmountFrom:
      description: "Не больше amountTo, если он передан."
      explode: true
      in: query
      name: amountFrom
      required: false
      schema:
        minimum: 1
        type: integer
      style: form
    AmountTo:
      description: "Не меньше amountFrom, если он передан."
      explode: true
      in: query
      name: amountTo
      required: false
      schema:
        minimum: 1
        type: integer
      style: form
    CreatedFrom:
      description: "Не позже createdTo, если он передан."
      explode: true
      in: query
      name: createdFrom
      required: false
      schema:
        format: date-time
        type: string
      style: form
    CreatedTo:
      description: "Не раньше createdFrom, если он передан."
      explode: true
      in: query
      name: createdTo
      required: false
      schema:
        format: date-time
        type: string
      style: form
    CompletedFrom:
      description: "Не позже completedTo, если он передан."
      explode: true
      in: query
      name: completedFrom
      required: false
      schema:
        format: date-time
        type: string
      style: form
    CompletedTo:
      description: "Не раньше completedFrom, если он передан."
      explode: true
      in: query
      name: completedTo
      required: false
      schema:
        format: date-time
        type: string
      style: form
    FailureCode:
      description: Нормализованный код причины платежа.
      explode: true
      in: query
      name: failureCode
      required: false
      schema:
        maxLength: 128
        type: string
      style: form
    Search:
      description: "Поиск по paymentId, orderId и описанию платежа."
      explode: true
      in: query
      name: search
      required: false
      schema:
        maxLength: 128
        type: string
      style: form
    RefundPaymentId:
      description: Идентификатор исходного платежа.
      explode: true
      in: query
      name: paymentId
      required: false
      schema:
        format: uuid
        type: string
      style: form
    RefundReasonCode:
      explode: true
      in: query
      name: reasonCode
      required: false
      schema:
        $ref: "#/components/schemas/RefundReason"
      style: form
    Sort:
      explode: true
      in: query
      name: sort
      required: false
      schema:
        default: createdAt
        enum:
        - createdAt
        - amount
        type: string
      style: form
    SortDirection:
      explode: true
      in: query
      name: sortDirection
      required: false
      schema:
        default: desc
        enum:
        - asc
        - desc
        type: string
      style: form
    Cursor:
      description: Непрозрачный курсор из предыдущего ответа. Используйте только с
        теми же фильтрами и сортировкой. При одинаковом sort key API использует стабильный
        вторичный ID.
      explode: true
      in: query
      name: cursor
      required: false
      schema:
        type: string
      style: form
    Limit:
      description: Количество записей в ответе.
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
      style: form
    WebhookKeyID:
      description: "Идентификатор активного ключа подписи webhook проекта — не сек\
        рет, можно раскрывать."
      explode: false
      in: header
      name: X-Webhook-Key-Id
      required: true
      schema:
        maxLength: 128
        minLength: 1
      style: simple
    WebhookTimestamp:
      description: Unix-время в секундах из подписанного payload. Получатель отклоняет
        значения старше пяти минут.
      explode: false
      in: header
      name: X-Webhook-Timestamp
      required: true
      schema:
        format: int64
        minimum: 1
      style: simple
    WebhookSignature:
      description: "`v1=` и hex HMAC-SHA-256 в нижнем регистре от UTF-8 `timestamp\
        \ + \".\" + rawBody`, на секрете подписи webhook, который выбирается по X-Webhook-Key-Id."
      explode: false
      in: header
      name: X-Webhook-Signature
      required: true
      schema:
        pattern: "^v1=[0-9a-f]{64}$"
      style: simple
  responses:
    SbpPaymentExisting:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Payment"
      description: Ранее созданный платёж СБП.
      headers:
        Location:
          explode: false
          schema:
            format: uri-reference
            type: string
          style: simple
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    SbpPaymentCreated:
      content:
        application/json:
          example:
            paymentId: c9ee7c85-4cc0-494f-a0de-0af7257a66a6
            orderId: order-20260903-001
            amount: 150000
            currency: RUB
            description: Подписка за сентябрь
            paymentMethod: sbp
            status: pending
            paymentUrl: https://pay.opayments.io/sbp/c9ee7c85-4cc0-494f-a0de-0af7257a66a6
            createdAt: 2026-09-03T12:00:00Z
            updatedAt: 2026-09-03T12:00:00Z
          schema:
            $ref: "#/components/schemas/CreatedPayment"
      description: Платёж через СБП создан.
      headers:
        Location:
          explode: false
          schema:
            format: uri-reference
            type: string
          style: simple
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    TpayPaymentExisting:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Payment"
      description: Ранее созданный платёж T-Pay.
      headers:
        Location:
          explode: false
          schema:
            format: uri-reference
            type: string
          style: simple
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    TpayPaymentCreated:
      content:
        application/json:
          example:
            paymentId: 4f4f3e2c-74fb-4bac-b37a-8e8560c1b01f
            orderId: order-20260903-002
            amount: 250000
            currency: RUB
            description: Заказ № 4821
            paymentMethod: tpay
            status: pending
            paymentUrl: https://pay.opayments.io/tpay/4f4f3e2c-74fb-4bac-b37a-8e8560c1b01f
            createdAt: 2026-09-03T12:00:00Z
            updatedAt: 2026-09-03T12:00:00Z
          schema:
            $ref: "#/components/schemas/CreatedPayment"
      description: Платёж через T-Pay создан.
      headers:
        Location:
          explode: false
          schema:
            format: uri-reference
            type: string
          style: simple
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    RefundExisting:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refund"
      description: Ранее созданный возврат с теми же параметрами.
      headers:
        Location:
          explode: false
          schema:
            format: uri-reference
            type: string
          style: simple
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Refund:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refund"
      description: Возврат.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    RefundPage:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefundPage"
      description: Страница возвратов платежа.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    RefundNotFoundError:
      content:
        application/json:
          example:
            error:
              type: resource_error
              code: refund_not_found
              message: Возврат не найден
              requestId: 7f660348-f20e-4577-9e8b-e5b3e52d8ee3
          schema:
            $ref: "#/components/schemas/Error"
      description: Возврат не найден.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    PaymentDetails:
      content:
        application/json:
          example:
            paymentId: c9ee7c85-4cc0-494f-a0de-0af7257a66a6
            orderId: order-20260903-001
            amount: 150000
            currency: RUB
            description: Заказ № 4820
            paymentMethod: sbp
            status: refunded
            createdAt: 2026-09-03T12:00:00Z
            updatedAt: 2026-09-03T12:06:00Z
            refunds:
            - refundId: 1d157da7-e7bb-48d8-9b02-5efc00c8c6d0
              paymentId: c9ee7c85-4cc0-494f-a0de-0af7257a66a6
              amount: 150000
              currency: RUB
              status: accepted
              reason: Возврат товара
              acceptedAt: 2026-09-03T12:06:00Z
              createdAt: 2026-09-03T12:05:00Z
              updatedAt: 2026-09-03T12:06:00Z
          schema:
            $ref: "#/components/schemas/PaymentDetails"
      description: Платёж.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    PaymentList:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaymentList"
      description: Страница платежей.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    ValidationError:
      content:
        application/json:
          example:
            error:
              type: validation_error
              code: invalid_request
              message: Проверьте параметры запроса
              details:
              - field: amount
                code: too_small
                message: Сумма должна быть больше нуля
              requestId: 7f660348-f20e-4577-9e8b-e5b3e52d8ee3
          schema:
            $ref: "#/components/schemas/Error"
      description: Некорректные параметры запроса.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    UnauthorizedError:
      content:
        application/json:
          example:
            error:
              type: authentication_error
              code: invalid_signature
              message: Подпись запроса не прошла проверку
              requestId: 7f660348-f20e-4577-9e8b-e5b3e52d8ee3
          schema:
            $ref: "#/components/schemas/Error"
      description: Не пройдена аутентификация или проверка подписи.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    NotFoundError:
      content:
        application/json:
          example:
            error:
              type: resource_error
              code: payment_not_found
              message: Платёж не найден
              requestId: 7f660348-f20e-4577-9e8b-e5b3e52d8ee3
          schema:
            $ref: "#/components/schemas/Error"
      description: Ресурс не найден.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    ForbiddenError:
      content:
        application/json:
          example:
            error:
              type: permission_error
              code: project_inactive
              message: Проект неактивен
              requestId: 7f660348-f20e-4577-9e8b-e5b3e52d8ee3
          schema:
            $ref: "#/components/schemas/Error"
      description: Операция недоступна для проекта.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    ConflictError:
      content:
        application/json:
          example:
            error:
              type: conflict_error
              code: order_id_params_mismatch
              message: Параметры текущего платежа по заказу отличаются
              requestId: 7f660348-f20e-4577-9e8b-e5b3e52d8ee3
          schema:
            $ref: "#/components/schemas/Error"
      description: Запрос конфликтует с текущим состоянием ресурса.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    RefundConflictError:
      content:
        application/json:
          example:
            error:
              type: conflict_error
              code: refund_params_mismatch
